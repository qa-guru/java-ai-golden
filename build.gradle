plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'eval.cli.EvalMain'
}

run {
    workingDir = layout.projectDirectory
}

repositories {
    mavenCentral()
}

def ollamaProps = [
        'live', 'model', 'judgeModel', 'judge', 'ollamaHost', 'writeFixtures', 'red',
        'repetitions', 'mode', 'outputDir', 'baseline', 'gate', 'evalConfig', 'artifacts',
        'provider', 'openaiBaseUrl', 'openaiApiKey', 'saveBaseline',
        'experiment', 'datasetSplit', 'judgeRepetitions', 'forceSaveBaseline',
        'ollamaTimeoutMinutes', 'candidate'
]

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform {
        def includeTagsProp = System.getProperty('includeTags')
        if (includeTagsProp) {
            includeTags(*(includeTagsProp.split(',')*.trim()))
        }
    }
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
    }
    ollamaProps.each { key ->
        def override = System.getProperty(key)
        if (override != null) {
            systemProperty key, override
        }
    }
}

def evalClasspath = sourceSets.main.runtimeClasspath

tasks.register('evalDeterministic', JavaExec) {
    group = 'eval'
    description = 'Cheap PR eval: fixtures, contract, retriever, quality gate'
    classpath = evalClasspath
    mainClass = 'eval.cli.EvalMain'
    workingDir = layout.projectDirectory
    args '--mode=deterministic', '--gate', '--artifacts=failure'
}

tasks.register('evalRegression', JavaExec) {
    group = 'eval'
    description = 'Compare fixture run to baselines/generation-v1.json (absolute 100% + delta)'
    classpath = evalClasspath
    mainClass = 'eval.cli.EvalMain'
    workingDir = layout.projectDirectory
    args '--mode=regression', '--gate', '--baseline=baselines/generation-v1.json'
}

tasks.register('evalLive', JavaExec) {
    group = 'eval'
    description = 'Limited live eval (Ollama). Skips red 7b rows unless -Dred=true'
    classpath = evalClasspath
    mainClass = 'eval.cli.EvalMain'
    workingDir = layout.projectDirectory
    args '--mode=live', '--judge=true'
    ollamaProps.each { key ->
        def override = System.getProperty(key)
        if (override != null) {
            systemProperty key, override
        }
    }
}

tasks.register('evalNightly', JavaExec) {
    group = 'eval'
    description = 'Full live eval: red rows, 5 repetitions, no gate (capture / report)'
    classpath = evalClasspath
    mainClass = 'eval.cli.EvalMain'
    workingDir = layout.projectDirectory
    args '--mode=live', '--red', '--repetitions=5', '--artifacts=always'
    ollamaProps.each { key ->
        def override = System.getProperty(key)
        if (override != null) {
            systemProperty key, override
        }
    }
}

tasks.register('evalNightlyRegression', JavaExec) {
    group = 'eval'
    description = 'Compare nightly protocol to baselines/nightly-generation-v1.json. Pass -Dcandidate=run.json to skip a second live execution.'
    classpath = evalClasspath
    mainClass = 'eval.cli.EvalMain'
    workingDir = layout.projectDirectory
    args '--mode=regression', '--live', '--red', '--repetitions=5', '--artifacts=always', '--gate',
            '--baseline=baselines/nightly-generation-v1.json'
    ollamaProps.each { key ->
        def override = System.getProperty(key)
        if (override != null) {
            systemProperty key, override
        }
    }
}

tasks.register('evalHoldout', JavaExec) {
    group = 'eval'
    description = 'Deterministic eval of the holdout split (not for prompt/grader/judge tuning)'
    classpath = evalClasspath
    mainClass = 'eval.cli.EvalMain'
    workingDir = layout.projectDirectory
    args '--mode=deterministic', '--split=holdout', '--gate', '--artifacts=failure',
            '--baseline=baselines/holdout-v1.json'
}

tasks.register('evalHoldoutRegression', JavaExec) {
    group = 'eval'
    description = 'Compare holdout fixtures to baselines/holdout-v1.json'
    classpath = evalClasspath
    mainClass = 'eval.cli.EvalMain'
    workingDir = layout.projectDirectory
    args '--mode=regression', '--split=holdout', '--gate', '--baseline=baselines/holdout-v1.json'
}

tasks.register('evalJudgeCalibration', JavaExec) {
    group = 'eval'
    description = 'Offline judge calibration (canned corpus). Does not affect production scores'
    classpath = evalClasspath
    mainClass = 'eval.cli.EvalMain'
    workingDir = layout.projectDirectory
    args '--calibrate-judge', '--artifacts=never'
}

tasks.register('evalJudgeCalibrationLive', JavaExec) {
    group = 'eval'
    description = 'Live judge calibration against labeled candidates (local Ollama; not CI)'
    classpath = evalClasspath
    mainClass = 'eval.cli.EvalMain'
    workingDir = layout.projectDirectory
    args '--calibrate-judge', '--live', '--artifacts=never'
    ollamaProps.each { key ->
        def override = System.getProperty(key)
        if (override != null) {
            systemProperty key, override
        }
    }
}

tasks.register('evalLiveRegression', JavaExec) {
    group = 'eval'
    description = 'Compare live run to baselines/live-generation-v1.json (delta gate). Pass -Dcandidate=run.json to skip a second live execution.'
    classpath = evalClasspath
    mainClass = 'eval.cli.EvalMain'
    workingDir = layout.projectDirectory
    args '--mode=regression', '--live', '--gate', '--baseline=baselines/live-generation-v1.json'
    ollamaProps.each { key ->
        def override = System.getProperty(key)
        if (override != null) {
            systemProperty key, override
        }
    }
}

tasks.register('evalPages', JavaExec) {
    group = 'eval'
    description = 'Build a static GitHub Pages site from build/eval'
    classpath = evalClasspath
    mainClass = 'eval.cli.PagesMain'
    workingDir = layout.projectDirectory
    args '--input=build/eval', '--output=build/eval-pages'
}

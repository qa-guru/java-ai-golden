name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # PR: deterministic mill + framework tests + fixture eval + regression vs committed baseline.
  # MAIN live smoke / NIGHTLY full live: local or self-hosted with Ollama. Not on ubuntu-latest.
  pr:
    name: deterministic eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit tests (mill + framework)
        run: ./gradlew test --console=plain
      - name: PR eval (fixtures, contract, retriever, gate)
        run: ./gradlew evalDeterministic --console=plain
      - name: Regression vs committed baseline
        run: ./gradlew evalRegression --console=plain
      - name: Holdout eval (fixtures, not for tuning)
        run: ./gradlew evalHoldout evalHoldoutRegression --console=plain
      - name: Judge calibration (canned)
        run: ./gradlew evalJudgeCalibration --console=plain
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: build/eval/**
          if-no-files-found: ignore

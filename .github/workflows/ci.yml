name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 02:00 Europe/Moscow (UTC+3, no DST)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Live smoke on Box2 runner, GPU ollama.qa.guru (qwen2.5-coder:7b)'
        type: boolean
        default: true
      run_nightly:
        description: 'Nightly protocol (red rows, 5 reps) on Box2 runner, GPU ollama.qa.guru'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Fixtures only. GitHub-hosted ubuntu-latest has no Ollama.
  pr:
    name: deterministic eval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      pages_ready: ${{ steps.pages-artifact.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit tests (mill + framework)
        run: ./gradlew test --console=plain
      - name: PR eval (fixtures, contract, retriever, gate)
        run: ./gradlew evalDeterministic --console=plain
      - name: Regression vs committed baseline
        run: ./gradlew evalRegression --console=plain
      # Holdout Gradle tasks are the official split eval (artifacts). Not on pull_request
      # (tuning leakage). Broken holdout fixtures still fail PR via ./gradlew test
      # (HoldoutDatasetTest). Artifacts run on push to main, cron, and dispatch.
      - name: Holdout eval (final split artifacts, not PR)
        if: github.event_name != 'pull_request'
        run: ./gradlew evalHoldout evalHoldoutRegression --console=plain
      - name: Judge calibration (canned)
        run: ./gradlew evalJudgeCalibration --console=plain
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports
          path: build/eval/**
          if-no-files-found: ignore
      - name: Build GitHub Pages site
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: ./gradlew evalPages --console=plain
      - name: Upload Pages artifact
        id: pages-artifact
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('build/eval-pages/index.html') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/eval-pages

  github-pages:
    name: GitHub Pages
    needs: pr
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.pr.outputs.pages_ready == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: java-ai-golden-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Box2 runner; inference https://ollama.qa.guru (Basic: secrets OLLAMA_USER / OLLAMA_PASSWORD).
  live:
    name: live smoke (Box2 runner, GPU ollama.qa.guru)
    needs: pr
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: [self-hosted, ollama, java-ai-golden]
    timeout-minutes: 90
    concurrency:
      group: java-ai-golden-ollama
      cancel-in-progress: false
    env:
      OLLAMA_TIMEOUT_MINUTES: '10'
      OLLAMA_HOST: https://ollama.qa.guru
      OLLAMA_USER: ${{ secrets.OLLAMA_USER }}
      OLLAMA_PASSWORD: ${{ secrets.OLLAMA_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Ollama health (qwen2.5-coder:7b)
        run: |
          if [ -z "$OLLAMA_USER" ] || [ -z "$OLLAMA_PASSWORD" ]; then
            echo "missing repo secrets OLLAMA_USER / OLLAMA_PASSWORD" >&2
            exit 1
          fi
          curl -sf -u "$OLLAMA_USER:$OLLAMA_PASSWORD" https://ollama.qa.guru/api/tags \
            | grep -F 'qwen2.5-coder:7b'
          curl -sf -u "$OLLAMA_USER:$OLLAMA_PASSWORD" https://ollama.qa.guru/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen2.5-coder:7b","stream":false,"messages":[{"role":"user","content":"ping"}],"options":{"num_predict":8}}' \
            >/dev/null
      - name: Live smoke
        run: ./gradlew evalLive --console=plain
      - name: Live regression vs committed baseline
        run: ./gradlew evalLiveRegression -Dcandidate="$(tr -d '\n' < build/eval/LATEST)/run.json" --console=plain
      - name: Upload live eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports-live
          path: build/eval/**
          if-no-files-found: ignore

  nightly:
    name: nightly live (Box2 runner, GPU ollama.qa.guru)
    needs: pr
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_nightly)
    runs-on: [self-hosted, ollama, java-ai-golden]
    timeout-minutes: 240
    concurrency:
      group: java-ai-golden-ollama
      cancel-in-progress: false
    env:
      OLLAMA_TIMEOUT_MINUTES: '10'
      OLLAMA_HOST: https://ollama.qa.guru
      OLLAMA_USER: ${{ secrets.OLLAMA_USER }}
      OLLAMA_PASSWORD: ${{ secrets.OLLAMA_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Ollama health (qwen2.5-coder:7b)
        run: |
          if [ -z "$OLLAMA_USER" ] || [ -z "$OLLAMA_PASSWORD" ]; then
            echo "missing repo secrets OLLAMA_USER / OLLAMA_PASSWORD" >&2
            exit 1
          fi
          curl -sf -u "$OLLAMA_USER:$OLLAMA_PASSWORD" https://ollama.qa.guru/api/tags \
            | grep -F 'qwen2.5-coder:7b'
          curl -sf -u "$OLLAMA_USER:$OLLAMA_PASSWORD" https://ollama.qa.guru/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen2.5-coder:7b","stream":false,"messages":[{"role":"user","content":"ping"}],"options":{"num_predict":8}}' \
            >/dev/null
      - name: Nightly protocol (red, 5 reps)
        run: ./gradlew evalNightly --console=plain
      - name: Nightly regression vs committed baseline
        run: ./gradlew evalNightlyRegression -Dcandidate="$(tr -d '\n' < build/eval/LATEST)/run.json" --console=plain
      - name: Upload nightly eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports-nightly
          path: build/eval/**
          if-no-files-found: ignore
